
<!-- ファイル名: index.html -->

<!DOCTYPE html><html>
<head>
  <meta charset="UTF-8">
  <title>LINE一括シェアツール</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { margin-top: 10px; padding: 10px; font-size: 16px; }
    .link { display: block; margin: 5px 0; }
  </style>
</head>
<body>
  <h1>LINEスキーム一括生成</h1>
  <button onclick="startAutoShare()">自動送信スタート</button>
  <div id="links"></div>  <script>
    let links = [];
    let currentIndex = 0;
    let intervalId = null;

    function toBase(num, base) {
      const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let res = '';
      do {
        res = chars[num % base] + res;
        num = Math.floor(num / base);
      } while (num > 0);
      return res;
    }

    function getRandomBase() {
      return Math.floor(Math.random() * (36 - 2 + 1)) + 2;
    }

    function getRandomSuffix(length = 10) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let res = '';
      for (let i = 0; i < length; i++) {
        res += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return res;
    }

    function generateLinks() {
      links = [];
      currentIndex = 0;

      const baseText = '煌竺財閥バンザイ🙌';
      const repeatCount = Math.floor(9999 / baseText.length);
      const coreText = baseText.repeat(repeatCount).substring(0, 9999 - 20); // 残り20文字をランダム用に確保

      for (let i = 0; i < 30; i++) { // 30リンク分作成
        let randomBase = getRandomBase();
        let label = toBase(i, randomBase).padStart(2, '0');
        let randomSuffix = getRandomSuffix(20); // 20文字ランダム

        let finalText = `[${label}]` + coreText + randomSuffix;

        let url = `line://msg/text/${encodeURIComponent(finalText)}`;

        links.push(url);

        let a = document.createElement('a');
        a.href = url;
        a.className = 'link';
        a.textContent = `シェア ${label}`;
        a.target = '_blank';
        document.getElementById('links').appendChild(a);
      }
    }

    function startAutoShare() {
      generateLinks();

      if (intervalId) clearInterval(intervalId);

      intervalId = setInterval(() => {
        if (currentIndex >= links.length) {
          clearInterval(intervalId);
          return;
        }

        window.location.href = links[currentIndex];
        currentIndex++;
      }, 1000); // 1秒ごと
    }
  </script></body>
</html>
