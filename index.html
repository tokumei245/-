<!DOCTYPE html><html>
<head>
  <meta charset="UTF-8">
  <title>LINE一括シェアツール</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { margin-top: 10px; padding: 10px; font-size: 16px; }
    .link { display: block; margin: 5px 0; }
  </style>
</head>
<body>
  <h1>LINEスキーム一括生成</h1>
  <button onclick="startAutoShare()">自動送信スタート</button>
  <div id="links"></div>  <script>
    let links = [];
    let currentIndex = 0;
    let intervalId = null;

    function getRandomSuffix(length = 50) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let res = '';
      for (let i = 0; i < length; i++) {
        res += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return res;
    }

    function generateLinks() {
      links = [];
      currentIndex = 0;

      const baseText = '煌竺財閥バンザイ🙌';
      const repeatCount = Math.ceil(9999 / baseText.length);
      const rawText = baseText.repeat(repeatCount);

      for (let i = 0; i < 30; i++) { // 30リンク分作成
        let suffix = getRandomSuffix(9999 - 5); // ラベル5文字分除く
        let finalText = `[${i}]` + rawText;
        finalText = finalText.substring(0, 9999 - suffix.length) + suffix;

        let url = `line://msg/text/${encodeURIComponent(finalText)}`;

        links.push(url);

        let a = document.createElement('a');
        a.href = url;
        a.className = 'link';
        a.textContent = `シェア ${i}`;
        a.target = '_blank';
        document.getElementById('links').appendChild(a);
      }
    }

    function startAutoShare() {
      generateLinks();

      if (intervalId) clearInterval(intervalId);

      intervalId = setInterval(() => {
        if (currentIndex >= links.length) {
          clearInterval(intervalId);
          return;
        }

        window.location.href = links[currentIndex];
        currentIndex++;
      }, 1000); // 1秒ごと
    }
  </script></body>
</html>
